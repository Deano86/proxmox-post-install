name: Validate shell script

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n proxmox-post-install.sh proxmox-no-subscription-nag.sh proxmox-auto-update.sh

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Run ShellCheck
        run: shellcheck proxmox-post-install.sh proxmox-no-subscription-nag.sh proxmox-auto-update.sh
